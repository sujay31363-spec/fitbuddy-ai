{% extends "base.html" %}


{% block content %}


<section class="hero">


    <div class="card">


        <span class="badge">
            AI FITNESS PLANNER
        </span>


        <h1>

            <span>Build</span>
            your plan

        </h1>


        <p>
            Create a practical 7-day general wellness plan
            based on your goal, body profile, and workout intensity.
        </p>


        {% if error %}

        <div class="alert error">
            {{ error }}
        </div>

        {% endif %}


        <form
            action="/generate-workout"
            method="post"
            class="grid"
        >


            <label>
                Username
                <input
                    type="text"
                    name="username"
                    placeholder="e.g. Maya"
                    required
                >
            </label>


            <label>
                User ID
                <input
                    type="text"
                    name="user_id"
                    placeholder="e.g. maya-001"
                    required
                >
            </label>


            <label>
                Age
                <input
                    type="number"
                    name="age"
                    min="13"
                    max="100"
                    required
                >
            </label>


            <label>
                Weight (kg)
                <input
                    type="number"
                    name="weight"
                    min="20"
                    max="399"
                    step="0.1"
                    required
                >
            </label>


            <label>
                Goal
                <select
                    name="goal"
                    required
                >
                    <option value="">
                        Select a goal
                    </option>
                    <option value="General Wellness">
                        General Wellness
                    </option>
                    <option value="Fat Loss">
                        Fat Loss
                    </option>
                    <option value="Muscle Gain">
                        Muscle Gain
                    </option>
                    <option value="Strength">
                        Strength
                    </option>
                    <option value="Endurance">
                        Endurance
                    </option>
                </select>
            </label>


            <label>
                Intensity
                <select
                    name="intensity"
                    required
                >
                    <option value="">
                        Select intensity
                    </option>
                    <option value="low">
                        Low
                    </option>
                    <option value="medium">
                        Medium
                    </option>
                    <option value="high">
                        High
                    </option>
                </select>
            </label>


            <button
                class="primary"
                type="submit"
            >
                Generate My Plan
            </button>


        </form>


    </div>


</section>


{% endblock %}
